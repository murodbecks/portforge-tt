[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portforge-tt"
version = "1.0.0"
description = "Autonomous model porting to Tenstorrent hardware with TTNN, powered by CHIA"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Abror Shopulatov" }]
keywords = ["tenstorrent", "ttnn", "model-porting", "autonomous", "chia", "hardware"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "chialoops>=1.0.0",
    "ray>=2.40.0",
    "pyyaml>=6.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pre-commit>=3.0"]

[tool.setuptools]
packages = ["ports", "guides", "prompts"]
py-modules = [
    "agent", "cluster", "compare", "models", "port",
    "portforge_eval", "portforge_loop", "runner",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
