[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portforge-tt"
version = "2.0.0"
description = "Autonomous model porting to Tenstorrent hardware with TTNN: supervisor/worker agents, trusted FP32 evaluator, sandboxed TT jobs"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.10"
authors = [{ name = "Abror Shopulatov" }]
keywords = ["tenstorrent", "ttnn", "model-porting", "autonomous", "agents", "mcp", "hardware"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=1.27.1,<2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyyaml>=6.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pre-commit>=3.0"]

[project.scripts]
portforge = "portforge_tt.portforge_loop:main"

[tool.setuptools]
packages = ["portforge_tt", "portforge_tt.agents"]

[tool.setuptools.package-data]
portforge_tt = ["prompts/*.md", "guides/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
